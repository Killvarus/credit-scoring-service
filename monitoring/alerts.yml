groups:
  - name: credit-scoring
    rules:
      - alert: FeatureDrift
        expr: max by (feature) (scoring_feature_psi) > 0.25
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "PSI признака {{ $labels.feature }} > 0.25 — распределение заявок сместилось, модель пора проверить"
      - alert: HighLatency
        expr: histogram_quantile(0.95, sum(rate(scoring_latency_seconds_bucket[5m])) by (le)) > 0.25
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "p95 времени ответа выше 250 мс"
      - alert: RejectRateJump
        expr: sum(rate(scoring_decisions_total{decision="reject"}[1h])) / sum(rate(scoring_decisions_total[1h])) > 0.7
        for: 30m
        labels: { severity: critical }
        annotations:
          summary: "Доля отказов выше 70% — проверить модель и входные данные"
