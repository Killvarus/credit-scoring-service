name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: DAG compiles
        run: python -m py_compile airflow/dags/credit_scoring_retrain.py

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose file is valid
        run: docker compose config -q
      - name: Build images
        run: |
          docker build --target api -t credit-scoring-service:ci .
          docker build --target bot -t credit-scoring-bot:ci .
      - name: Smoke test container
        run: |
          docker run -d --name api -p 8000:8000 credit-scoring-service:ci
          for i in $(seq 1 30); do curl -fs localhost:8000/ready && break; sleep 1; done
          curl -fs -X POST localhost:8000/predict -H 'Content-Type: application/json' -d @tests/data/example.json
          curl -fs localhost:8000/metrics | grep scoring_requests_total
      - name: Container logs
        if: always()
        run: docker logs api || true

  k8s-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary k8s/

  spark-batch:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install
        # pandas 2.2 — версия, с которой тестируется PySpark 4.0
        run: pip install "pyspark==4.0.1" "pyarrow>=15" "pandas==2.2.3" "numpy<2.3" lightgbm==4.7.0 pydantic==2.12.5
      - name: Batch scoring on sample
        run: python batch/spark_score.py --input tests/data/sample_applications.csv --output /tmp/scored
